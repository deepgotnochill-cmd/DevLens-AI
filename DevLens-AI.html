/* The analyzer is the visual entry point. Keep the report dense enough for side-by-side reading. */
.launch {
  display: flex;
  align-items: center;
  text-align: left;
  min-height: 310px;
  padding: clamp(24px, 4vw, 58px);
  background: radial-gradient(ellipse at 87% 45%, #1c4844 0, transparent 46%), linear-gradient(115deg, #111c21, #101c20);
  border-color: #34504e;
}
.launch .heroContent { max-width: 68%; }
.launch .eyebrow, .launch .samples { justify-content: flex-start; }
.launch h1 { font-size: clamp(36px, 4.5vw, 70px); margin: 14px 0; line-height: 1.02; }
.launch p { margin: 0; max-width: 52ch; text-wrap: pretty; }
.launch #analyze { margin: 22px 0 0; }
.launch .heroart {
  inset: 0 0 0 auto;
  width: 34%;
  opacity: 1;
  mask-image: linear-gradient(90deg, transparent, black 21%);
}
.launch .optics { inset: 0; width: 100%; height: 100%; opacity: .96; }
.launch .urlfield { min-height: 46px; border-color: #405853; }
.journeys button { position: relative; background: linear-gradient(130deg, #17252b, var(--card)); }
.journeys svg { width: 24px; height: 24px; }
.revision, .revision a { display: inline-flex; align-items: center; gap: 7px; }
.revision { margin-top: 10px; color: var(--muted); font: 12px ui-monospace, monospace; }
.revision a { border-left: 1px solid var(--border); padding-left: 9px; }
.promptChoices { display: flex; flex-wrap: wrap; gap: 8px; }
.promptChoices button { color: var(--accent); background: #162925; border: 1px solid #324f49; border-radius: 20px; padding: 7px 12px; font-size: 13px; }
.promptChoices button:hover { background: #213b34; }
.citation { margin: 12px 0; border: 1px solid var(--border); padding: 12px; border-radius: 8px; }
.citation summary { overflow-wrap: anywhere; }
.citation a { display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 730px) {
  .launch { min-height: 0; padding: 24px 18px; }
  .launch .heroContent { max-width: 100%; }
  .launch .heroart { height: 140px; width: 30%; opacity: .45; }
  .launch h1 { font-size: clamp(32px, 7vw, 46px); }
  .launch p { max-width: 82%; }
  .journeys button { text-align: left; align-items: flex-start; }
}
@media (max-width: 420px) {
  .launch .heroart { opacity: .23; }
  .launch #analyze { display: grid; }
  .launch .urlfield, .launch .primary { min-height: 44px; }
  .launch p { max-width: 100%; }
}

/* Report surfaces and the evidence workspace */
.shell header { position: sticky; inset-block-start: 0; z-index: 3; background: #0d171cef; backdrop-filter: blur(16px); }
.launch { border-radius: 20px; box-shadow: inset 0 1px #a1ffec15, 0 12px 32px #0002; }
.launch .heroart { display: grid; place-items: center; }
.lensReticle { position: absolute; width: 79%; aspect-ratio: 1; border: 1px dashed #7ce3ca35; border-radius: 50%; pointer-events: none; }
.launch h1 span { color: #a2f3db; }
.stat { position: relative; overflow: hidden; background: linear-gradient(125deg,#16252b,#111a20 74%); }
.stat .metricicon { border: 1px solid #ffffff12; }
.stat b { letter-spacing: -.055em; }
.reviewDesk { display: grid; grid-template-columns: minmax(190px,.7fr) minmax(0,1.7fr); gap: 16px; align-items: start; }
.reviewDesk .panel { margin: 0; border-radius: 16px; }
.sourceContext { background: radial-gradient(ellipse at 0 0,#1d3a38,transparent 65%),var(--card); }
.contextIcon { display: inline-grid; place-items:center; padding: 12px; color: var(--accent); border: 1px solid #38615a; border-radius: 12px; margin-bottom: 18px; }
.sourceContext .fileName { overflow-wrap: anywhere; color: #e2eeea; font-family: ui-monospace,monospace; }
.sourceContext dl { margin: 18px 0; }
.sourceContext dl div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.sourceContext dt { color: var(--muted); }
.sourceContext dd { margin: 0; overflow-wrap: anywhere; text-align: right; }
.sourceContext a { display: inline-flex; align-items:center; gap: 8px; font-size: 13px; }
.composer #explain { margin-bottom: 0; }
.composer select,.composer textarea { width: 100%; min-width: 0; background: #0c151a; color: #e3efeb; border-color: #34454b; padding: 12px; border-radius: 9px; }
.composer textarea { min-height: 128px; line-height: 1.55; }
.composer .notice { border-inline-start: 3px solid #d4ab78; }
#analyze[aria-busy=true],#explain[aria-busy=true] { position: relative; }
#analyze[aria-busy=true]::after,#explain[aria-busy=true]::after { content: ""; position: absolute; inset: auto 0 -5px; height: 2px; background: linear-gradient(90deg,transparent,var(--accent),transparent); }
@media (prefers-reduced-motion:no-preference) {
  .enterView .pageh,.enterView .reviewDesk,.enterView .developer { animation: workspace-arrival .32s ease-out both; }
  .activityTrace { stroke-dasharray: 1; animation: trace-reveal .6s ease-out both; }
  .enterView .lensReticle { animation: lens-lock 1.4s ease-out both; }
  .primary,.promptChoices button,.journeys button { transition: transform .16s ease,background-color .16s ease,border-color .16s ease; }
  .primary:active,.promptChoices button:active { transform: translateY(1px); }
  #analyze[aria-busy=true]::after,#explain[aria-busy=true]::after { animation: reading 1.3s ease-in-out infinite alternate; }
  @keyframes workspace-arrival { from { opacity:.4;transform:translateY(6px) } }
  @keyframes trace-reveal { from { stroke-dashoffset:1 } to { stroke-dashoffset:0 } }
  @keyframes lens-lock { from { opacity:0;transform:scale(.87) rotate(-22deg) } }
  @keyframes reading { from { transform:scaleX(.25);opacity:.45 } to { transform:scaleX(1);opacity:1 } }
}
@media(max-width:850px) {
  .reviewDesk { grid-template-columns: 1fr; }
  .sourceContext { order: 2; }
  .composer { order: 1; }
}

function stats(r       ){return `<div class="stats">${[['star','Stars',r.stars,'gold'],['branch','Forks',r.forks,'purple'],['issue','Open items',r.open_items,'green'],['eye','Watchers',r.watchers,'blue']].map(([key,label,val,color])=>`<article class="stat"><div><span class="metricicon ${color}">${ic(String(key),17)}</span><span>${label}</span></div><b title="${Number(val).toLocaleString()}">${compact(Number(val))}</b></article>`).join('')}</div>`}
function activity(r       ){
 const data=buckets(r.commits,new Date(r.analyzed_at),days),max=Math.max(1,...data.map(d=>d.count)),x=(i       )=>36+i*458/(data.length-1),y=(n       )=>115-90*n/max;
 const pts=data.map((d,i)=>`${x(i)},${y(d.count)}`).join(' ');
 return `<section class="panel chartpanel"><div class="panelhead"><h3>${ic('activity')} Commit activity</h3><div class="period" role="group" aria-label="Activity period">${[7,14,30].map(n=>`<button data-days="${n}" aria-pressed="${n===days}">${n}D</button>`).join('')}</div></div><p>Sampled commits by day · UTC</p><svg viewBox="0 0 510 146" class="chart" role="group" aria-label="Daily commit counts from the retrieved sample"><defs><linearGradient id="area" x2="0" y2="1"><stop stop-color="#65ddc9" stop-opacity=".34"/><stop offset="1" stop-color="#65ddc9" stop-opacity=".015"/></linearGradient></defs>${[...new Set([0,Math.round(max/2),max])].map(n=>`<path d="M36 ${y(n)}H494" stroke="#33343d" stroke-dasharray="3 5"/><text x="12" y="${y(n)+3}">${n}</text>`).join('')}<polygon points="36,115 ${pts} 494,115" fill="url(#area)"/><polyline class="activityTrace" pathLength="1" points="${pts}" fill="none" stroke="#71e7cd" stroke-width="2.7" stroke-linejoin="round"/>${data.map((d,i)=>`<g class="sample-point" tabindex="0" role="img" aria-label="${d.date}, ${d.count} sampled commits"><rect x="${x(i)-7}" y="16" width="14" height="103" fill="transparent"/><g class="sample-tip" pointer-events="none"><line x1="${x(i)}" x2="${x(i)}" y1="22" y2="115" stroke="#89dfce" stroke-dasharray="3 4"/><circle cx="${x(i)}" cy="${y(d.count)}" r="4" fill="#adffed"/><rect x="${Math.min(384,Math.max(8,x(i)-54))}" y="0" width="116" height="20" rx="5" fill="#213c3d"/><text x="${Math.min(384,Math.max(8,x(i)-54))+58}" y="14" text-anchor="middle">${d.date.slice(5)} · ${d.count} commits</text></g></g>`).join('')}${[0,Math.floor((days-1)/2),days-1].map((i,j)=>`<text x="${x(i)}" text-anchor="${['start','middle','end'][j]}" y="139">${date(data[i].date).split(',')[0]}</text>`).join('')}</svg><small class="legend"><i></i>Commits in retrieved history</small></section>`;
}
function languages(r       ){
 const entries=Object.entries(r.languages).sort((a,b)=>b[1]-a[1]),total=entries.reduce((a,e)=>a+e[1],0);
 if(!total)return '<section class="panel"><h3>Languages</h3><p>No language bytes reported by GitHub.</p></section>';
 const rows=entries.slice(0,3);if(entries.length>3)rows.push(['Other',entries.slice(3).reduce((a,e)=>a+e[1],0)]);
 let sum=0;const gradient=rows.map(([,n],i)=>{const start=sum;sum+=100*n/total;return `${colors[i]} ${start}% ${sum}%`}).join(',');
 return `<section class="panel"><div class="panelhead"><h3>${ic('code')} Languages</h3></div><p>Share of repository code by bytes</p><div class="langbody"><div class="donut" style="background:conic-gradient(${gradient})"><div><b>${entries.length}</b><small>languages</small></div></div><div class="langkey">${rows.map(([k,n],i)=>`<div title="${n.toLocaleString()} bytes"><i style="background:${colors[i]}"></i><span>${h(k)}</span><b>${(100*n/total).toFixed(1)}%</b></div>`).join('')}</div></div></section>`;
}
const srcLink=(r       ,path       ,type='blob')=>h(r.url+'/'+type+'/'+r.head+'/'+path.split('/').map(encodeURIComponent).join('/'));
function commitList(r       ,limit       ){return `<section class="panel list"><div class="panelhead"><h3>${ic('branch')} Recent commits</h3>${limit===4?'<button data-view="activity" class="textbtn">View activity</button>':''}</div>${r.commits.slice(0,limit).map(c=>`<div class="row"><a class="hash" href="${h(r.url)}/commit/${h(c.sha)}" target="_blank" rel="noreferrer">${h(c.sha.slice(0,7))}</a><span>${h(c.message)}</span><small>${date(c.date)}</small></div>`).join('')||'<p>No commits in this repository.</p>'}</section>`}
function evidence(r       ){return `<section class="panel"><h3>${ic('insight')} Maintenance signals</h3><p>Evidence from the inspected revision</p>${signals(r).map(s=>`<div class="signal"><span>${h(s.name)}</span><small class="${s.path?'found':''}">${s.path?'Detected':s.uncertain?'Partial tree':'No match'}</small></div>`).join('')}</section>`}
function projectMap(r       ){
 const prefix=dir?dir+'/':'';
 const counts=new Map               ();
 for(const f of r.files){
   if(!f.path.startsWith(prefix))continue;
   const relative=f.path.slice(prefix.length), split=relative.indexOf('/');
   if(split<0 && f.type==='tree' && !counts.has(relative))counts.set(relative,0);
   if(split<0 || f.type!=='blob')continue;
   const child=relative.slice(0,split);
   counts.set(child,(counts.get(child)||0)+1);
 }
 const folders=[...counts.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]));
 const maximum=folders[0]?.[1]||1;
 const parent=dir.split('/').slice(0,-1).join('/');
 return `<section class="panel mapPanel"><div class="panelhead"><h3>${ic('folder')} Project map</h3>
   ${dir?`<button class="textbtn" data-dir="${h(parent)}">Parent folder</button>`:''}</div>
   <p>${h(dir||r.full_name)} · ${folders.length} immediate folders. Bars count indexed files beneath each folder.</p>
   ${r.truncated?'<p class="mapNote">Partial tree. Counts cover only the paths returned by GitHub.</p>':''}
   <div class="mapGrid">${folders.slice(0,12).map(([name,n])=>{
     const path=prefix+name;
     const inner=`<b>${ic('folder',15)} ${h(name)}</b><small>${n} indexed ${n===1?'file':'files'}</small><span class="mapTrack"><i style="width:${100*n/maximum}%"></i></span>`;
     return n?`<button class="mapTile" data-dir="${h(path)}">${inner}</button>`:`<a class="mapTile" href="${srcLink(r,path,'tree')}" target="_blank" rel="noreferrer">${inner}</a>`;
   }).join('')}</div>${!folders.length?'<p>No child folders in this listing.</p>':folders.length>12?'<p>Showing the 12 largest folders. All returned paths are searchable below.</p>':''}</section>`;
}
function tooling(r       ){
 const rules                  =[
   ['Next.js',/^next\.config\.(ts|mjs|js|cjs)$/i],['TypeScript',/^tsconfig(?:\..+)?\.json$/i],
   ['Docker Compose',/^(?:docker-)?compose\.ya?ml$/i],['Docker',/^(?:Dockerfile(?:\..+)?|.+\.Dockerfile)$/i],
   ['Node.js packages',/^package\.json$/i],['Python packaging',/^(?:pyproject\.toml|requirements\.txt|Pipfile)$/i],
   ['Rust packages',/^Cargo\.toml$/],['Go modules',/^go\.mod$/],['Prisma',/^schema\.prisma$/i],
   ['GitHub Actions',/^\.github\/workflows\/[^/]+\.ya?ml$/]
 ];
 const blobs=r.files.filter(f=>f.type==='blob').sort((a,b)=>a.path.length-b.path.length||a.path.localeCompare(b.path));
 return rules.flatMap(([name,pattern])=>{
   const hit=blobs.find(f=>pattern.test(f.path.split('/').pop() )||pattern.test(f.path));
   return hit?[{name,path:hit.path}]:[];
 });
}
function toolPanel(r       ){
 const hits=tooling(r);
 return `<section class="panel"><h3>${ic('terminal')} Tooling evidence</h3><p>Configuration files found in the indexed revision.</p>
   ${hits.map(t=>`<div class="signal"><b>${h(t.name)}</b><a href="${srcLink(r,t.path)}" target="_blank" rel="noreferrer">${h(t.path)}</a></div>`).join('')||'<p>No recognized configuration files in the sample.</p>'}</section>`;
}
function explorer(r       ){
 const prefix=dir?dir+'/':'',needle=fileSearch.toLowerCase();
 const files=r.files.filter(f=>needle?f.path.toLowerCase().includes(needle):f.path.startsWith(prefix)&&!f.path.slice(prefix.length).includes('/')).sort((a,b)=>Number(b.type==='tree')-Number(a.type==='tree')||a.path.localeCompare(b.path));
 return `<section class="panel"><div class="panelhead"><h3>${ic('folder')} File explorer</h3><span class="badge">${h(r.default_branch)}</span></div><p>${r.truncated?'Partial file listing':'Indexed file tree'} · ${h(r.head.slice(0,7))}</p><input id="filter" placeholder="Filter paths…" aria-label="Filter file paths" value="${h(fileSearch)}"><div class="crumb"><button data-dir="">Repository root</button> / ${h(dir)}</div><div id="files">${files.slice(0,200).map(f=>`<div class="row">${ic(f.type==='tree'?'folder':'file',16)}${f.type==='tree' && r.files.some(e=>e.path.startsWith(f.path+'/'))?`<button class="plain" data-dir="${h(f.path)}">${h(f.path)}</button>`:`<a href="${srcLink(r,f.path,f.type==='tree'?'tree':'blob')}" target="_blank" rel="noreferrer">${h(f.path)}</a>`}</div>`).join('')||'<p>No matching paths.</p>'}${files.length>200?'<p>Showing the first 200 matches. Refine your filter.</p>':''}</div></section>`;
}
function docs(r       ){const files=r.files.filter(f=>f.type==='blob'&&/(^|\/)(readme|contributing|changelog|license)|^docs\//i.test(f.path));return `<section class="panel"><h3>${ic('book')} Documentation</h3><p>Documentation and guides found in the sampled tree.</p>${files.slice(0,160).map(f=>`<div class="row">${ic('file',16)}<a href="${srcLink(r,f.path)}" target="_blank" rel="noreferrer">${h(f.path)}</a></div>`).join('')||'<p>No matching documents in the sample.</p>'}</section>`}
function brief(r       ){
  const observations=signals(r).map(s=>s.name+' — '+(s.path || (s.uncertain?'unknown in partial tree':'no matching path')));
  return ['Review '+r.url+' at revision '+(r.head||'(empty repository)')+'.',
    'Sample: '+r.commits.length+' commits and '+r.files.length+' paths. Tree coverage: '+(r.truncated?'partial':'complete returned tree')+'.',
    ...observations,
    'Inspect the source before proposing up to three improvements. For each, cite the exact file and lines, explain the impact, suggest a minimal edit and give a verification step. State what you could not verify.'
  ].join('\n');
}
function recommendations(r       ){return `<section class="panel"><h3>${ic('insight')} Evidence-backed recommendations</h3><details class="brief"><summary>Prepare an AI review prompt</summary><button class="textbtn" data-export-review>Download review as Markdown</button><p>Copy this prompt into your AI tool with repository access.</p><textarea readonly aria-label="Repository review prompt">${h(brief(r))}</textarea></details><p>File-presence checks at revision ${h(r.head.slice(0,7))}. Open each source to review its contents.</p>${signals(r).map(s=>`<article class="rec"><b>${h(s.name)}</b><p>${s.path?`Detected in <a href="${srcLink(r,s.path)}" target="_blank" rel="noreferrer">${h(s.path)}</a>.`:s.uncertain?'Coverage is partial. Inspect the full tree before drawing a conclusion.':`No matching path in the indexed tree. ${h(s.action)}`}</p></article>`).join('')}<a href="${srcLink(r,'','tree')}" target="_blank" rel="noreferrer">Inspect revision on GitHub</a></section>`}
const reviewPrompts = [
 ['Explain this file', 'What does this file do, and which lines show its main responsibility?'],
 ['Trace the inputs', 'How does this file handle inputs and errors? Cite the relevant lines.'],
 ['Suggest a test', 'Suggest a test for a behavior visible in this file. Cite the lines that justify it.']
];
function ai(r       ){
 const files=r.files.filter(f=>f.type==='blob'&&f.size>0&&f.size<=60000&&/\.(py|tsx?|jsx?|md|go|rs|cpp|c|h|css|java|rb|toml|ya?ml|json|sh|kt)$/i.test(f.path));
 const file=files.find(f=>f.path===selected) || files[0];
 selected=file?.path || '';
 return `<section class="reviewDesk">
   <aside class="panel sourceContext">
     <div class="contextIcon">${ic('code',26)}</div>
     <h3>Source context</h3>
     ${file?`<p class="fileName">${h(file.path)}</p><dl>
       <div><dt>Branch</dt><dd>${h(r.default_branch)}</dd></div>
       <div><dt>Revision</dt><dd>${h(r.head.slice(0,7))}</dd></div>
       <div><dt>File size</dt><dd>${file.size.toLocaleString()} bytes</dd></div>
     </dl><a href="${srcLink(r,file.path)}" target="_blank" rel="noreferrer">Open source ${ic('link',14)}</a>`:'<p>No eligible text files in this report.</p>'}
   </aside>
   <section class="panel composer">
     <h3>${ic('spark')} Ask about this file</h3>
     <form id="explain" aria-busy="${aiBusy}">
       <label>Source file<select id="source">${files.map(f=>`<option ${f.path===selected?'selected':''}>${h(f.path)}</option>`).join('')}</select></label>
       <label>Your question<textarea id="question" maxlength="1200" minlength="3" required placeholder="Which lines should I understand first?">${h(question)}</textarea></label>
       <div class="promptChoices" role="group" aria-label="Suggested questions">${reviewPrompts.map(([label],i)=>`<button type="button" data-prompt="${i}">${h(label)}</button>`).join('')}</div>
       <button class="primary" ${!explainApi||!file||aiBusy?'disabled':''}>${ic('spark')} ${aiBusy?'Retrieving evidence…':'Explain code'}</button>
     </form>
     ${!explainApi?'<div class="notice">Open Recommendations to prepare a review prompt, or use Code explainer on the hosted dashboard.</div>':''}
     <div aria-live="polite">${answer}</div>
   </section>
 </section>`;
}
