services:
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    ports: ["127.0.0.1:3000:8080"]
    depends_on: [api]
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      DATABASE_URL: postgresql://devlens:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db/devlens
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: devlens
      POSTGRES_DB: devlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U devlens"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pgdata:

